<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Open Account</title>
</head>
<body>
    <h1>Open Account</h1>
    <form method="post">
        <label>Account Number: <input type="text" name="account_number" required></label><br>
        <label>Initial Balance: <input type="number" step="0.01" name="balance" required></label><br>
        <label>Customer:
            <select name="customer_id">
                {% for c in customers %}
                <option value="{{ c[0] }}">{{ c[1] }} {{ c[2] }} (ID: {{ c[0] }})</option>
                {% endfor %}
            </select>
        </label><br>
        <button type="submit">Create</button>
    </form>
    <p><a href="{{ url_for('index') }}">Back to Home</a></p>
</body>
</html>
